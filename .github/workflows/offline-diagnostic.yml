name: Temporary Linux module diagnosis
on:
  push:
    branches: [pipeline-with-shared-docker]
    paths:
      - .github/workflows/offline-diagnostic.yml
      - validation/run_offline_suite.py
permissions:
  contents: read
jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Prepare empty client home
        shell: python
        run: |
          import os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'chem-module-diagnostic-home'
          path.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write(f'CODEX_HOME={path}\n')
      - run: python -m pip install -r requirements-yaml.txt
      - run: python validation/run_offline_suite.py --self-check
      - name: test_acceptance_only
        run: python validation/run_offline_suite.py --module tests.pipeline.test_acceptance_only
      - name: test_aggregate_status_diagnostic
        run: python validation/run_offline_suite.py --module tests.pipeline.test_aggregate_status_diagnostic
