name: Offline contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare credential-free client home
        shell: python
        run: |
          import os
          from pathlib import Path
          client_home = Path(os.environ['RUNNER_TEMP']) / 'chem-agent-empty-codex'
          client_home.mkdir(parents=True, exist_ok=False)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'CODEX_HOME={client_home}\n')
      - run: python -m pip install -r requirements-yaml.txt
      - name: Verify offline supervisor process boundaries
        run: python validation/run_offline_suite.py --self-check
      - name: Run offline suite in an owned process session
        run: python validation/run_offline_suite.py
      - run: python validation/deepseek-api/verify_prompt_contract.py
      - run: python validation/deepseek-api/verify_acceptance_prompt.py check
      - run: python validation/deepseek-api/verify_planner.py check
      - run: python validation/deepseek-api/verify_skillnet_contract.py
