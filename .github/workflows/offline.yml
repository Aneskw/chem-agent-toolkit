name: Offline contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CODEX_HOME: ${{ runner.temp }}/chem-agent-empty-codex
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-yaml.txt
      - run: python -m unittest discover -s tests -q
      - run: python validation/deepseek-api/verify_prompt_contract.py
      - run: python validation/deepseek-api/verify_acceptance_prompt.py check
      - run: python validation/deepseek-api/verify_planner.py check
      - run: python validation/deepseek-api/verify_skillnet_contract.py
